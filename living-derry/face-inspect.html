<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Face rig inspection</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#2b2d2f;--panel:#1d1f21;--ink:#e6e3dc;--muted:#a3a39c;--line:#3c3f42;--accent:#d8b36a}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
#views{position:fixed;inset:0 0 188px 0}
canvas{display:block;width:100%;height:100%}
.labels{position:fixed;inset:0 0 188px 0;display:grid;grid-template-columns:repeat(3,1fr);pointer-events:none}
.labels span{padding:10px 14px;color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase;border-right:1px solid var(--line)}
.labels span:last-child{border-right:0}
#ui{position:fixed;left:0;right:0;bottom:0;height:188px;background:var(--panel);border-top:1px solid var(--line);display:grid;grid-template-columns:1.1fr 1.4fr 1.2fr;gap:18px;padding:12px 16px;overflow:auto}
h1{font-size:14px;margin:0 0 6px;font-weight:600}
label{display:grid;grid-template-columns:78px 1fr 38px;align-items:center;gap:8px;margin:2px 0;color:var(--muted)}
label output{color:var(--ink);font-variant-numeric:tabular-nums;text-align:right}
input[type=range]{width:100%;accent-color:var(--accent)}
select,button{background:#2c2f32;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font:inherit}
button:hover{border-color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0}
.check{display:flex;gap:6px;align-items:center;color:var(--ink)}
#report{font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);white-space:pre-wrap}
#report b{color:var(--ink);font-weight:600}
.warn{color:#e3a07a}
@media (max-width:820px){#ui{grid-template-columns:1fr;height:46vh}#views,.labels{bottom:46vh}}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head>
<body>
<div id="views"><canvas id="c" aria-label="Front, three-quarter and side views of the loaded head"></canvas></div>
<div class="labels" aria-hidden="true"><span>Front</span><span>Three-quarter</span><span>Side</span></div>
<section id="ui">
  <div>
    <h1>Face rig inspection</h1>
    <div class="row">
      <select id="asset" aria-label="Asset">
        <option value="lee">Head scan · CC BY 3.0 (static)</option>
        <option value="fixture">Rig test fixture (not art)</option>
      </select>
      <select id="light" aria-label="Lighting">
        <option value="studio">Neutral studio</option>
        <option value="sky">Overhead skylight only</option>
      </select>
    </div>
    <div class="row">
      <label class="check" style="display:flex"><input type="checkbox" id="auto" checked> Auto performance</label>
      <label class="check" style="display:flex"><input type="checkbox" id="track" checked> Eyes follow front camera</label>
    </div>
    <div class="row"><button id="lunge">Preview lunge</button><button id="neutral">Neutral</button></div>
  </div>
  <div>
    <label>Gaze X<input type="range" id="gx" min="-1" max="1" step=".01" value="0"><output></output></label>
    <label>Gaze Y<input type="range" id="gy" min="-1" max="1" step=".01" value="0"><output></output></label>
    <label>Blink<input type="range" id="blink" min="0" max="1" step=".01" value="0"><output></output></label>
    <label>Jaw<input type="range" id="jaw" min="0" max="1" step=".01" value="0"><output></output></label>
    <label>Head yaw<input type="range" id="yaw" min="-.8" max=".8" step=".01" value="0"><output></output></label>
    <label>Head pitch<input type="range" id="pitch" min="-.45" max=".45" step=".01" value="0"><output></output></label>
  </div>
  <div id="report" role="status" aria-live="polite">Loading…</div>
</section>
<script type="module" src="face-inspect.js"></script>
</body>
</html>
